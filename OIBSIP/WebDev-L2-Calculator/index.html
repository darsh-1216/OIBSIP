<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator — Oasis Infobyte</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Font Awesome 6 -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="page-wrapper">

    <!-- Ambient blobs for depth -->
    <div class="ambient-blob blob-1" aria-hidden="true"></div>
    <div class="ambient-blob blob-2" aria-hidden="true"></div>

    <main class="calculator" role="main" aria-label="Calculator application">

      <!-- ── Display ─────────────────────────────────────── -->
      <section class="display" aria-label="Calculator display">
        <div class="display__expression" id="expression" aria-live="polite" aria-label="Expression"></div>
        <div class="display__result"     id="result"     aria-live="polite" aria-label="Result">0</div>
      </section>

      <!-- ── Button grid ───────────────────────────────── -->
      <div class="btn-grid" role="group" aria-label="Calculator buttons" id="btnGrid">

        <!-- Row 1: utility -->
        <button
          class="btn btn--function"
          data-action="clear"
          aria-label="Clear all"
          type="button"
        >C</button>

        <button
          class="btn btn--function"
          data-action="plus-minus"
          aria-label="Toggle positive / negative"
          type="button"
        ><i class="fa-solid fa-plus-minus" aria-hidden="true"></i></button>

        <button
          class="btn btn--function"
          data-action="percent"
          aria-label="Percent"
          type="button"
        >%</button>

        <button
          class="btn btn--operator"
          data-action="operator"
          data-value="÷"
          aria-label="Divide"
          type="button"
        ><i class="fa-solid fa-divide" aria-hidden="true"></i></button>

        <!-- Row 2 -->
        <button class="btn btn--number" data-action="number" data-value="7" aria-label="7" type="button">7</button>
        <button class="btn btn--number" data-action="number" data-value="8" aria-label="8" type="button">8</button>
        <button class="btn btn--number" data-action="number" data-value="9" aria-label="9" type="button">9</button>

        <button
          class="btn btn--operator"
          data-action="operator"
          data-value="×"
          aria-label="Multiply"
          type="button"
        ><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>

        <!-- Row 3 -->
        <button class="btn btn--number" data-action="number" data-value="4" aria-label="4" type="button">4</button>
        <button class="btn btn--number" data-action="number" data-value="5" aria-label="5" type="button">5</button>
        <button class="btn btn--number" data-action="number" data-value="6" aria-label="6" type="button">6</button>

        <button
          class="btn btn--operator"
          data-action="operator"
          data-value="−"
          aria-label="Subtract"
          type="button"
        ><i class="fa-solid fa-minus" aria-hidden="true"></i></button>

        <!-- Row 4 -->
        <button class="btn btn--number" data-action="number" data-value="1" aria-label="1" type="button">1</button>
        <button class="btn btn--number" data-action="number" data-value="2" aria-label="2" type="button">2</button>
        <button class="btn btn--number" data-action="number" data-value="3" aria-label="3" type="button">3</button>

        <button
          class="btn btn--operator"
          data-action="operator"
          data-value="+"
          aria-label="Add"
          type="button"
        ><i class="fa-solid fa-plus" aria-hidden="true"></i></button>

        <!-- Row 5 -->
        <button
          class="btn btn--number btn--backspace"
          data-action="backspace"
          aria-label="Backspace"
          type="button"
        ><i class="fa-solid fa-delete-left" aria-hidden="true"></i></button>

        <button class="btn btn--number" data-action="number" data-value="0" aria-label="0" type="button">0</button>

        <button
          class="btn btn--number"
          data-action="decimal"
          aria-label="Decimal point"
          type="button"
        >.</button>

        <button
          class="btn btn--equals"
          data-action="equals"
          aria-label="Equals"
          type="button"
        ><i class="fa-solid fa-equals" aria-hidden="true"></i></button>

      </div><!-- /.btn-grid -->

      <!-- Keyboard hint -->
      <p class="kbd-hint" aria-label="Keyboard shortcut hint">
        <i class="fa-solid fa-keyboard" aria-hidden="true"></i>
        Keyboard &amp; numpad supported
      </p>

    </main>

  </div><!-- /.page-wrapper -->

  <script src="script.js"></script>
</body>
</html>
